name: Publish temporary benchmark to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-benchmark-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out benchmark-only repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned direct dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build static site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only the static benchmark build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy temporary benchmark
        id: deployment
        uses: actions/deploy-pages@v4
